<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0c12" />
    <meta name="description" content="Konomi: your anime list, scored by comparison, with a taste model that knows you." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
    <title>Konomi</title>
    <style>
      /* Shown instantly, before any JavaScript: the mark draws itself, then the app fades in over it. */
      html, body { background: #0d0c12; margin: 0; }
      #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #0d0c12; transition: opacity .45s cubic-bezier(.16,1,.3,1), visibility .45s; }
      #splash.out { opacity: 0; visibility: hidden; }
      #splash svg { width: min(36vw, 180px); height: auto; overflow: visible; }
      #splash text { font: 400 54px 'Dela Gothic One', 'Zen Kaku Gothic New', system-ui, sans-serif; fill: #f4f1ea; opacity: 0; animation: sp-in .5s .15s cubic-bezier(.16,1,.3,1) forwards; }
      #splash path { fill: none; stroke: #ff7340; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: sp-draw .9s .25s cubic-bezier(.16,1,.3,1) forwards; }
      @keyframes sp-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes sp-draw { to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { #splash text, #splash path { animation: none; opacity: 1; stroke-dashoffset: 0; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 200 120">
        <path pathLength="1" d="M30 30c34-24 118-26 146 0 24 24 18 66-14 80-40 16-112 12-140-10C2 80 6 44 34 26c12-8 30-12 50-12" />
        <text x="100" y="78" text-anchor="middle">好み</text>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
